<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Houston Metro Study Map</title>
<style>
  :root {
    /* Editorial atlas palette */
    --paper: #f5ede0;
    --paper-2: #ede2cf;
    --ink: #1f2a3b;
    --ink-soft: #3d4a60;
    --ink-mute: #6b7889;
    --rule: #d8c9ae;
    --rule-soft: #e6d8be;
    --terracotta: #c2613a;
    --terracotta-soft: #e3a37e;
    --gold: #c69635;
    --sage: #6f8c70;
    --water: #afc7d7;
    --water-deep: #88adc4;
    --water-line: #6e96b1;

    /* Zone palette — varied, muted, distinguishable */
    --z-downtown: #3d4a60;
    --z-midtown:  #8a6a7a;
    --z-heights:  #7a8b5a;
    --z-galleria: #b07d3b;
    --z-memorial: #9c8d5e;
    --z-katy:     #a3956a;
    --z-sugar:    #b58a4f;
    --z-pearland: #a87c6a;
    --z-clear:    #5a8a8c;
    --z-pasadena: #6e6a5a;
    --z-northside:#8b6a4a;
    --z-woodlands:#5a7a55;
    --z-humble:   #6f8a72;
    --z-friend:   #7c8c9c;

    --shadow-card: 0 2px 0 rgba(31,42,59,0.05), 0 14px 40px -18px rgba(31,42,59,0.25);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  /* Subtle paper texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(194, 97, 58, 0.04), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(111, 140, 112, 0.05), transparent 40%);
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ===== Header ===== */
  header {
    padding: 28px 36px 22px;
    border-bottom: 1px solid var(--rule);
    background: linear-gradient(180deg, #f9f2e6 0%, var(--paper) 100%);
    position: relative;
  }
  header::after {
    content: "";
    position: absolute;
    left: 36px; right: 36px; bottom: -1px;
    height: 1px;
    background: var(--rule-soft);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  .brand .eyebrow {
    font-family: "Iowan Old Style", "Georgia", serif;
    font-style: italic;
    color: var(--terracotta);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
  }
  header h1 {
    margin: 6px 0 4px;
    font-family: "Iowan Old Style", "Georgia", "Times New Roman", serif;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--ink);
  }
  header .subtitle {
    color: var(--ink-mute);
    font-size: 14px;
    max-width: 560px;
    line-height: 1.5;
  }

  /* ===== Main grid ===== */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 65fr 35fr;
    gap: 24px;
    padding: 24px 36px;
    min-height: 0;
  }

  /* ===== Map ===== */
  .map-card {
    background: linear-gradient(160deg, #fbf5e8 0%, #f0e6d2 100%);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
  }
  .map-card::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px dashed var(--rule);
    border-radius: 10px;
    pointer-events: none;
  }
  .map-card svg {
    width: 100%;
    height: auto;
    display: block;
    max-height: calc(100vh - 240px);
    position: relative;
    z-index: 1;
  }

  /* SVG zones */
  .zone {
    cursor: pointer;
    transition: opacity 0.18s ease, transform 0.18s ease, filter 0.18s ease;
    transform-origin: center;
    transform-box: fill-box;
    fill-opacity: 0.78;
    stroke-width: 1.4;
    stroke-linejoin: round;
  }
  .zone:hover {
    fill-opacity: 1;
    filter: drop-shadow(0 4px 8px rgba(31,42,59,0.18));
  }
  .zone.selected {
    fill-opacity: 1;
    stroke: var(--terracotta) !important;
    stroke-width: 2.4;
    filter: drop-shadow(0 0 0 4px rgba(194,97,58,0.18)) drop-shadow(0 6px 14px rgba(194,97,58,0.35));
  }

  .water-fill {
    fill: var(--water);
    stroke: var(--water-deep);
    stroke-width: 1;
    pointer-events: none;
  }
  .bayou {
    fill: none;
    stroke: var(--water-line);
    stroke-linecap: round;
    pointer-events: none;
    opacity: 0.75;
  }

  .grid-line {
    stroke: rgba(31, 42, 59, 0.06);
    stroke-width: 1;
    pointer-events: none;
  }

  .zone-label {
    fill: var(--ink);
    font-family: "Iowan Old Style", "Georgia", serif;
    font-size: 12px;
    font-weight: 600;
    text-anchor: middle;
    pointer-events: none;
    letter-spacing: 0.3px;
    paint-order: stroke;
    stroke: rgba(245, 237, 224, 0.85);
    stroke-width: 3;
    stroke-linejoin: round;
  }

  .water-label {
    fill: var(--water-line);
    font-family: "Iowan Old Style", "Georgia", serif;
    font-style: italic;
    font-size: 11px;
    text-anchor: middle;
    pointer-events: none;
    letter-spacing: 1px;
  }

  .quadrant {
    fill: var(--ink-mute);
    font-family: "Iowan Old Style", "Georgia", serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    text-anchor: middle;
    pointer-events: none;
    opacity: 0.45;
  }

  /* Highways */
  .highway {
    fill: none;
    stroke: #b89968;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
    opacity: 0.78;
  }
  .highway-major { stroke-width: 3.2; opacity: 0.88; }
  .ring-road {
    fill: none;
    stroke: #c2613a;
    stroke-width: 1.4;
    stroke-dasharray: 6 5;
    stroke-linecap: round;
    pointer-events: none;
    opacity: 0.45;
  }
  .ring-label {
    fill: var(--terracotta);
    font-family: "Iowan Old Style", serif;
    font-size: 10px;
    font-style: italic;
    text-anchor: middle;
    pointer-events: none;
    opacity: 0.75;
    letter-spacing: 1.5px;
  }
  .hwy-shield-bg {
    fill: #f9f1de;
    stroke: #5a4226;
    stroke-width: 1.2;
  }
  .hwy-shield-text {
    fill: #2a1c0c;
    font-family: ui-sans-serif, "Helvetica Neue", sans-serif;
    font-size: 9px;
    font-weight: 800;
    text-anchor: middle;
    pointer-events: none;
    letter-spacing: 0.2px;
  }
  .county-line {
    fill: none;
    stroke: var(--ink-mute);
    stroke-width: 1.1;
    stroke-dasharray: 4 6;
    opacity: 0.32;
    pointer-events: none;
  }
  .county-label {
    fill: var(--ink-mute);
    font-family: "Iowan Old Style", serif;
    font-style: italic;
    font-size: 12px;
    text-anchor: middle;
    pointer-events: none;
    opacity: 0.55;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .landmark-dot {
    fill: var(--terracotta);
    stroke: #fbf6ea;
    stroke-width: 2;
    pointer-events: none;
  }
  .landmark-label {
    fill: var(--ink);
    font-family: "Iowan Old Style", serif;
    font-size: 10px;
    font-weight: 600;
    text-anchor: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke: rgba(245, 237, 224, 0.9);
    stroke-width: 2.5;
    stroke-linejoin: round;
    letter-spacing: 0.3px;
  }

  .study-mode .zone-label { display: none; }

  /* Compass rose */
  .compass-ring { fill: rgba(245, 237, 224, 0.85); stroke: var(--rule); stroke-width: 1; }
  .compass-needle-n { fill: var(--terracotta); }
  .compass-needle-s { fill: var(--ink); opacity: 0.55; }
  .compass-letter {
    fill: var(--ink);
    font-family: "Iowan Old Style", serif;
    font-size: 10px;
    font-weight: 700;
    text-anchor: middle;
    pointer-events: none;
  }

  /* Scale bar */
  .scale-line { stroke: var(--ink); stroke-width: 1.5; }
  .scale-text {
    fill: var(--ink-mute);
    font-size: 10px;
    font-family: "Iowan Old Style", serif;
    text-anchor: middle;
  }

  /* ===== Side panel ===== */
  .panel {
    background: #fbf6ea;
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 28px 28px 30px;
    overflow-y: auto;
    max-height: calc(100vh - 240px);
    box-shadow: var(--shadow-card);
    position: relative;
  }
  .panel::-webkit-scrollbar { width: 8px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }

  .panel.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--ink-mute);
    min-height: 280px;
  }
  .empty-state {
    max-width: 240px;
  }
  .empty-state .seal {
    width: 56px; height: 56px;
    margin: 0 auto 14px;
    border-radius: 50%;
    border: 2px dashed var(--rule);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    color: var(--terracotta);
  }
  .empty-state h2 {
    font-family: "Iowan Old Style", serif;
    font-size: 18px;
    margin: 0 0 6px;
    color: var(--ink);
    font-weight: 700;
  }
  .empty-state p { margin: 0; font-size: 13px; line-height: 1.5; }

  /* Card content */
  .card-eyebrow {
    color: var(--terracotta);
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .card-name {
    font-family: "Iowan Old Style", "Georgia", serif;
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 6px;
    line-height: 1.1;
    color: var(--ink);
    letter-spacing: -0.4px;
  }
  .card-meta {
    color: var(--ink-mute);
    font-size: 13px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-meta .dot {
    width: 4px; height: 4px;
    background: var(--terracotta);
    border-radius: 50%;
  }

  .section { margin-bottom: 22px; }
  .section h3 {
    font-family: "Iowan Old Style", serif;
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section h3::before {
    content: "";
    width: 18px; height: 1px;
    background: var(--terracotta);
  }

  .character {
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.65;
    margin: 0;
    font-family: "Iowan Old Style", "Georgia", serif;
  }

  .facts {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
    font-size: 14px;
    color: var(--ink);
    border-top: 1px solid var(--rule-soft);
  }
  .facts .row {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule-soft);
    align-items: baseline;
  }
  .facts .row .label {
    color: var(--ink-mute);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
  }
  .facts .row .val {
    color: var(--ink-soft);
    line-height: 1.45;
  }

  ul.bullets {
    margin: 0;
    padding: 0;
    list-style: none;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.55;
  }
  ul.bullets li {
    position: relative;
    padding-left: 22px;
    margin-bottom: 10px;
  }
  ul.bullets li::before {
    content: "";
    position: absolute;
    left: 0; top: 9px;
    width: 12px; height: 1px;
    background: var(--terracotta);
  }
  ul.bullets li:last-child { margin-bottom: 0; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    background: rgba(194, 97, 58, 0.08);
    border: 1px solid rgba(194, 97, 58, 0.25);
    color: var(--terracotta);
    padding: 5px 11px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .hook {
    position: relative;
    padding: 18px 20px 18px 30px;
    background: linear-gradient(135deg, #f7e9d2 0%, #f1deba 100%);
    border-radius: 8px;
    color: var(--ink);
    font-family: "Iowan Old Style", "Georgia", serif;
    font-style: italic;
    font-size: 15px;
    line-height: 1.55;
  }
  .hook::before {
    content: "“";
    position: absolute;
    top: -2px; left: 8px;
    font-size: 44px;
    line-height: 1;
    color: var(--terracotta);
    font-family: "Iowan Old Style", "Georgia", serif;
  }

  /* ===== Footer ===== */
  footer {
    border-top: 1px solid var(--rule);
    padding: 14px 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f0e5cf;
    font-size: 13px;
    color: var(--ink-soft);
    gap: 16px;
    flex-wrap: wrap;
  }
  .footer-meta {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .footer-meta .sep {
    width: 4px; height: 4px;
    background: var(--terracotta);
    border-radius: 50%;
  }
  .counter {
    color: var(--terracotta);
    font-weight: 700;
    font-family: "Iowan Old Style", serif;
    font-size: 14px;
  }
  .study-toggle {
    display: flex;
    align-items: center;
    gap: 12px;
    user-select: none;
    font-weight: 600;
    color: var(--ink);
  }
  .study-toggle input { display: none; }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    background: var(--rule);
    border-radius: 999px;
    transition: background 0.2s;
    border: 1px solid var(--rule-soft);
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    background: var(--paper);
    border-radius: 50%;
    transition: transform 0.2s;
    box-shadow: 0 1px 3px rgba(31,42,59,0.25);
  }
  .study-toggle input:checked + .switch { background: var(--terracotta); }
  .study-toggle input:checked + .switch::after { transform: translateX(18px); }

  /* Responsive */
  @media (max-width: 920px) {
    main {
      grid-template-columns: 1fr;
      padding: 16px;
      gap: 16px;
    }
    .map-card svg { max-height: none; }
    .panel { max-height: none; }
    header { padding: 22px 18px 18px; }
    header h1 { font-size: 26px; }
    footer { padding: 12px 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="eyebrow">Field Guide № 01</span>
    </div>
    <h1>Houston Metro Study Map</h1>
    <div class="subtitle">A bird's-eye field guide to fourteen distinct communities — click any region to open its dossier.</div>
  </header>

  <main>
    <div class="map-card">
      <svg id="map" viewBox="0 0 1200 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Houston metro map">
        <!-- Subtle reference grid -->
        <g>
          <line class="grid-line" x1="0" y1="275" x2="1200" y2="275" />
          <line class="grid-line" x1="0" y1="550" x2="1200" y2="550" />
          <line class="grid-line" x1="0" y1="825" x2="1200" y2="825" />
          <line class="grid-line" x1="300" y1="0" x2="300" y2="1100" />
          <line class="grid-line" x1="600" y1="0" x2="600" y2="1100" />
          <line class="grid-line" x1="900" y1="0" x2="900" y2="1100" />
        </g>

        <!-- Quadrant labels (faint) -->
        <text class="quadrant" x="600" y="36">NORTH</text>
        <text class="quadrant" x="600" y="1080">SOUTH</text>
        <text class="quadrant" x="36" y="555" transform="rotate(-90 36 555)">WEST</text>
        <text class="quadrant" x="1170" y="555" transform="rotate(90 1170 555)">EAST</text>

        <!-- ===== County boundaries ===== -->
        <g>
          <!-- Harris County outline (rough, central) -->
          <path class="county-line" d="M 270 290 L 920 290 L 920 620 Q 880 645 870 690 L 870 800 L 700 890 L 460 890 L 360 820 L 320 720 L 320 480 L 270 400 Z" />
          <!-- Galveston/Brazoria divide south -->
          <path class="county-line" d="M 700 890 L 950 920" />
          <!-- Brazoria/Fort Bend west -->
          <path class="county-line" d="M 460 890 L 380 1020" />
          <!-- Fort Bend/Harris west -->
          <path class="county-line" d="M 360 820 L 250 760 L 220 600" />
          <!-- Waller boundary -->
          <path class="county-line" d="M 270 290 L 180 230" />
        </g>

        <!-- County labels -->
        <g>
          <text class="county-label" x="600" y="135">MONTGOMERY CO.</text>
          <text class="county-label" x="170" y="240">WALLER CO.</text>
          <text class="county-label" x="1015" y="240">LIBERTY CO.</text>
          <text class="county-label" x="1100" y="540">CHAMBERS CO.</text>
          <text class="county-label" x="1075" y="965">GALVESTON CO.</text>
          <text class="county-label" x="490" y="980">BRAZORIA CO.</text>
          <text class="county-label" x="195" y="950">FORT BEND CO.</text>
          <text class="county-label" x="500" y="320" font-size="14">HARRIS COUNTY</text>
        </g>

        <!-- ===== Water bodies ===== -->
        <!-- Galveston Bay -->
        <path class="water-fill" d="
          M 855 615
          Q 905 635 950 685
          L 1010 715
          L 1080 705
          Q 1135 740 1145 800
          Q 1150 880 1115 940
          L 1050 985
          L 970 1010
          Q 890 1000 855 935
          L 825 855
          L 815 770
          L 825 695
          Z" />
        <!-- Trinity Bay (extension of Galveston Bay NE) -->
        <path class="water-fill" d="M 1010 715 L 1080 705 L 1130 670 L 1145 700 L 1110 740 L 1050 735 Z" opacity="0.85" />
        <!-- Lake Houston -->
        <ellipse class="water-fill" cx="810" cy="295" rx="42" ry="65" />
        <!-- Sheldon Reservoir -->
        <ellipse class="water-fill" cx="780" cy="450" rx="14" ry="20" opacity="0.7" />
        <!-- Barker / Addicks reservoirs (W) -->
        <ellipse class="water-fill" cx="295" cy="555" rx="22" ry="14" opacity="0.65" />
        <ellipse class="water-fill" cx="295" cy="510" rx="20" ry="13" opacity="0.65" />

        <!-- ===== Bayous & rivers ===== -->
        <!-- Buffalo Bayou + Ship Channel -->
        <path class="bayou" stroke-width="3" d="M 235 545 Q 380 540 500 552 Q 575 558 610 555 Q 700 567 780 595 Q 820 610 855 620" />
        <!-- White Oak Bayou -->
        <path class="bayou" stroke-width="2" d="M 380 400 Q 460 440 530 475 Q 580 500 605 540" />
        <!-- Brays Bayou -->
        <path class="bayou" stroke-width="2" d="M 320 645 Q 470 635 600 655 Q 720 672 800 685" />
        <!-- Sims Bayou -->
        <path class="bayou" stroke-width="1.5" d="M 380 720 Q 510 710 620 720 Q 720 730 790 740" opacity="0.55" />
        <!-- San Jacinto River (north into Lake Houston, then south) -->
        <path class="bayou" stroke-width="2" d="M 815 160 Q 825 230 815 290" />
        <path class="bayou" stroke-width="2.2" d="M 815 360 Q 830 450 830 540 Q 830 590 855 615" />
        <!-- Cypress Creek (NW of Lake Houston) -->
        <path class="bayou" stroke-width="1.5" d="M 470 320 Q 580 310 700 320 Q 760 325 800 295" opacity="0.55" />

        <!-- ===== Ring roads ===== -->
        <ellipse class="ring-road" cx="610" cy="555" rx="80" ry="85" />
        <ellipse class="ring-road" cx="610" cy="555" rx="180" ry="195" />
        <ellipse class="ring-road" cx="605" cy="550" rx="370" ry="395" />

        <!-- Ring road labels -->
        <text class="ring-label" x="610" y="464" transform="rotate(0 610 464)">LOOP 610</text>
        <text class="ring-label" x="610" y="354">BELTWAY 8</text>
        <text class="ring-label" x="605" y="148">GRAND PARKWAY · TX-99</text>

        <!-- ===== Highways ===== -->
        <g>
          <!-- I-10 (E-W) -->
          <path class="highway highway-major" d="M 70 555 L 605 558 L 880 565" />
          <!-- I-45 (N-S) -->
          <path class="highway highway-major" d="M 615 130 L 615 555 L 605 880" />
          <!-- I-69 / US-59 (SW to NE) -->
          <path class="highway highway-major" d="M 290 770 Q 460 670 605 558 Q 695 480 760 380 L 800 320" />
          <!-- US-290 (NW from downtown) -->

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderCard(id) {
  const z = ZONE_DATA[id];
  if (!z) return;
  panel.classList.remove('empty');
  panel.innerHTML = `
    <div class="card-eyebrow">Region Dossier</div>
    <h2 class="card-name">${escapeHTML(z.name)}</h2>
    <div class="card-meta">
      <span>${escapeHTML(z.county)} County</span>
      <span class="dot"></span>
      <span>${escapeHTML(z.distanceFromDowntown)}</span>
    </div>

    <div class="section">
      <h3>Character</h3>
      <p class="character">${escapeHTML(z.character)}</p>
    </div>

    <div class="section">
      <h3>Vital Statistics</h3>
      <div class="facts">
        <div class="row"><div class="label">Population</div><div class="val">${escapeHTML(z.population)}</div></div>
        <div class="row"><div class="label">Incorporated</div><div class="val">${escapeHTML(z.incorporated)}</div></div>
        <div class="row"><div class="label">Employers</div><div class="val">${z.majorEmployers.map(escapeHTML).join(' · ')}</div></div>
      </div>
    </div>

    <div class="section">
      <h3>Known For</h3>
      <ul class="bullets">
        ${z.knownFor.map(k => `<li>${escapeHTML(k)}</li>`).join('')}
      </ul>
    </div>

    <div class="section">
      <h3>Routes In</h3>
      <div class="chips">
        ${z.highways.map(h => `<span class="chip">${escapeHTML(h)}</span>`).join('')}
      </div>
    </div>

    <div class="section">
      <h3>Mnemonic</h3>
      <div class="hook">${escapeHTML(z.hook)}</div>
    </div>
  `;
  panel.scrollTop = 0;
}

function selectZone(id, el) {
  if (selectedZone) selectedZone.classList.remove('selected');
  el.classList.add('selected');
  selectedZone = el;
  renderCard(id);
  if (studyToggle.checked) {
    studied.add(id);
    studiedCount.textContent = studied.size;
  }
}

document.querySelectorAll('.zone').forEach(el => {
  el.addEventListener('click', () => selectZone(el.dataset.zone, el));
  el.setAttribute('tabindex', '0');
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', ZONE_DATA[el.dataset.zone].name);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      selectZone(el.dataset.zone, el);
    }
  });
});

studyToggle.addEventListener('change', () => {
  if (studyToggle.checked) {
    map.classList.add('study-mode');
    studiedCounterWrap.style.display = 'inline';
  } else {
    map.classList.remove('study-mode');
    studiedCounterWrap.style.display = 'none';
  }
});

document.getElementById('zone-count').textContent = Object.keys(ZONE_DATA).length;
</script>
</body>
</html>
